background {
    monitor =
    color = rgba(20, 20, 20, 0.8)
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.2
    outer_color = rgba(15, 12, 15, 0.75)
    inner_color = rgba(89, 89, 89, 0.29)
    font_color = rgb(255, 255, 255)
    font_family = JetBrains Mono
    fade_on_empty = false
    placeholder_text = <i>(=^･ω･^=)</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 90
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}
